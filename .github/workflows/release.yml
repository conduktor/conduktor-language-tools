# A v<major>.<minor>.<patch> tag builds the extension and the language server, publishes the .vsix as a GitHub
# release, then to the VS Code Marketplace and Open VSX, and the language server to npm, where Zed installs it from. A
# suffix (v0.2.0-rc.1) makes a pre-release everywhere. Run by hand, it only builds, from any branch, as artifacts.
#
# Each registry publishes from an environment of its own, which only v* tags may use:
# - marketplace: an Azure managed identity, through GitHub's OIDC token (AZURE_CLIENT_ID, AZURE_TENANT_ID); no secret.
# - openvsx: OVSX_PAT, an Open VSX access token for the conduktor namespace.
# - npm: npm's trusted publishing, through GitHub's OIDC token; no secret.
# Open VSX without its token is skipped with a warning, so a release does not wait for the account.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      vsix: ${{ steps.version.outputs.vsix }}
      server: ${{ steps.server.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Release tags look like v1.2.3 or v1.2.3-rc.1, not $GITHUB_REF_NAME"
              exit 1
            fi
            # VS Code takes only major.minor.patch; the suffix marks a pre-release and stays in the file name. npm
            # takes the whole label.
            version="${BASH_REMATCH[1]}"
            label="${GITHUB_REF_NAME#v}"
            prerelease=$([[ -n "${BASH_REMATCH[2]}" ]] && echo true || echo false)
          else
            version=$(node -p "require('./extensions/vscode/package.json').version")
            label="$version-${GITHUB_SHA::7}"
            prerelease=false
          fi
          (cd extensions/vscode && npm pkg set version="$version")
          (cd packages/language-server && npm pkg set version="$label")
          {
            echo "label=$label"
            echo "prerelease=$prerelease"
            echo "vsix=conduktor-console-$label.vsix"
          } >> "$GITHUB_OUTPUT"

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

      - name: Package the extension
        env:
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          VSIX: ${{ steps.version.outputs.vsix }}
          # Only the packaging steps build with the key: the tests above run on builds that send nothing.
          SEGMENT_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_KEY }}
        run: |
          flags=(--out "$GITHUB_WORKSPACE/$VSIX")
          if [[ "$PRERELEASE" == true ]]; then flags+=(--pre-release); fi
          pnpm --filter conduktor-console exec node esbuild.mjs
          pnpm --filter conduktor-console run vsix "${flags[@]}"

      - name: Package the language server
        id: server
        env:
          SEGMENT_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_KEY }}
        run: |
          pnpm --filter @conduktor/console-language-server build
          tarball=$(cd packages/language-server && npm pack --pack-destination "$GITHUB_WORKSPACE" --json | jq -r '.[0].filename')
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            ${{ steps.version.outputs.vsix }}
            ${{ steps.server.outputs.tarball }}
          if-no-files-found: error

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          VSIX: ${{ steps.version.outputs.vsix }}
        run: |
          flags=(--title "$GITHUB_REF_NAME" --generate-notes --verify-tag)
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$VSIX" "${flags[@]}"

  marketplace:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      # No subscription: the identity only signs in to Azure DevOps, which the Marketplace runs on.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish
        env:
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          VSIX: ${{ needs.build.outputs.vsix }}
        run: |
          flags=(--packagePath "$GITHUB_WORKSPACE/$VSIX" --azure-credential --skip-duplicate)
          if [[ "$PRERELEASE" == true ]]; then flags+=(--pre-release); fi
          pnpm --filter conduktor-console exec vsce publish "${flags[@]}"

  openvsx:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: openvsx
    permissions:
      contents: read
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - if: env.OVSX_PAT == ''
        run: echo "::warning::No OVSX_PAT in the openvsx environment; not published to Open VSX."

      - if: env.OVSX_PAT != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: env.OVSX_PAT != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - if: env.OVSX_PAT != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - if: env.OVSX_PAT != ''
        run: pnpm install --frozen-lockfile

      - if: env.OVSX_PAT != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - if: env.OVSX_PAT != ''
        name: Publish
        env:
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          VSIX: ${{ needs.build.outputs.vsix }}
        run: |
          flags=(--packagePath "$GITHUB_WORKSPACE/$VSIX" --skip-duplicate)
          if [[ "$PRERELEASE" == true ]]; then flags+=(--pre-release); fi
          pnpm --filter conduktor-console run openvsx "${flags[@]}"

  npm:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      # npm's trusted publishing signs in with this token, and records which workflow built the package.
      id-token: write
    steps:
      # Node 24 ships npm 11, the first to publish with an OIDC token.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Publish
        env:
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          TARBALL: ${{ needs.build.outputs.server }}
        run: |
          # A pre-release goes to the next tag, so Zed, which installs latest, keeps the last release.
          flags=(--access public --provenance)
          if [[ "$PRERELEASE" == true ]]; then flags+=(--tag next); fi
          npm publish "$GITHUB_WORKSPACE/$TARBALL" "${flags[@]}"
