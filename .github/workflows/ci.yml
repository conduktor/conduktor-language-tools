# What CONTRIBUTING.md asks before every commit, on every pull request and on main: lint, formatting, types, tests,
# the builds and the .vsix, on the lowest Node we support and the current LTS; the UI tests in a VS Code window; and the
# Zed extension's formatting and lints. The live suite needs a Console, so it stays a local run (CONTRIBUTING.md, "The
# live suite").
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build the language server, and package the VS Code extension with its MCP server
        run: |
          pnpm --filter @conduktor/console-language-server build
          pnpm package

  ui:
    name: VS Code UI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Drive the walkthrough in VS Code, on a virtual display
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" pnpm test:ui

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: extensions/vscode/test/ui/screenshots/

  rust:
    name: Zed extension (Rust)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: extensions/zed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          target: wasm32-wasip2
          components: rustfmt, clippy
          cache-workspaces: extensions/zed

      - run: cargo fmt --check
      - run: cargo clippy --release --target wasm32-wasip2 -- -D warnings
